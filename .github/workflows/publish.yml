name: Publish to npm

on:
  release:
    types: [published]
  # Permite relanzar la publicacion de un tag existente sin recrear el release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (por ejemplo v0.2.2)'
        required: true
        type: string
      loglevel:
        description: 'Nivel de log de npm'
        required: false
        default: notice
        type: choice
        options: [notice, verbose]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Requerido para trusted publishing (OIDC) y la atestacion de provenance.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          # Se acepta el tag con o sin prefijo v (v0.2.2 o 0.2.2).
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "El tag del release ($TAG) no coincide con package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # prepublishOnly ejecuta npm run build antes de publicar. El aviso de npm
      # sobre bin ("was invalid and removed") solo indica que normalizo
      # ./dist/cli.js a dist/cli.js; el bin se conserva.
      - name: Publish
        run: npm publish --provenance --access public --loglevel "${{ inputs.loglevel || 'notice' }}"
